# Reverse proxy (brief §3 / design §13). Serves the web app and the API from ONE origin,
# so the refresh cookie is first-party and CORS isn't needed in production.
#   /            → frontend:3000
#   /api/        → backend:8000
# TLS: terminate here (mount certs and add a `listen 443 ssl` server) or at your load balancer.

upstream web { server frontend:3000; }
upstream api { server backend:8000; }

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 20m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Overwrite (not append) client-supplied forwarding headers; the API trusts these
    # only when TRUST_PROXY_HEADERS=true.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://api;
    }

    location /api/ {
        proxy_pass http://api;
    }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
