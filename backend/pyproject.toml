[project]
name = "adaptive-practice-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/seed/*" = ["E501"]  # long prose strings in sample content
"app/modules/ai_tutor/prompts.py" = ["E501"]  # prompt prose

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
