name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests only ever touch these throwaway services (conftest refuses non-local hosts).
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ap_test
  TEST_REDIS_URL: redis://localhost:6379/15

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ap_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ap_test
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Migrations apply, roll back and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ap_e2e
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ap_e2e
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      ENVIRONMENT: test # mounts the test-only email inbox the E2E tests read
      EMAIL_BACKEND: console
      REQUIRE_EMAIL_VERIFICATION: "true" # E2E covers the full verification flow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start API
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m scripts.seed_sample_content
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - name: Build and start web
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npm start -- -p 3000 > web.log 2>&1 &
          npx --yes wait-on -t 60000 http://localhost:3000 http://localhost:8000/api/v1/health
      - name: Playwright
        working-directory: frontend
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            frontend/test-results
            backend/api.log
            frontend/web.log
